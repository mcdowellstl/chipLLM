steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE_NAME/$_SERVICE_NAME:$COMMIT_SHA',
      '-t', 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE_NAME/$_SERVICE_NAME:latest',
      '.'
    ]

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE_NAME/$_SERVICE_NAME:$COMMIT_SHA'
    ]
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE_NAME/$_SERVICE_NAME:latest'
    ]

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', '$_SERVICE_NAME',
      '--image', 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE_NAME/$_SERVICE_NAME:$COMMIT_SHA',
      '--region', '$_REGION',
      '--allow-unauthenticated',
      '--service-account', '$_SERVICE_ACCOUNT',
      '--set-env-vars', 'GOOGLE_CLOUD_LOCATION=$_REGION,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,KNOWLEDGE_ADHOC_BUCKET=gs://chipllm-adhoc-playbooks,KNOWLEDGE_STORAGE_BUCKET=gs://chipllm-l0-playbooks,SYSTEM_INSTRUCTIONS_BUCKET=gs://chipllm-instructions',
      '--set-secrets', 'SUPABASE_KEY=SUPABASE_KEY:latest,SUPABASE_URL=SUPABASE_URL:latest'
    ]

images:
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE_NAME/$_SERVICE_NAME:$COMMIT_SHA'
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_SERVICE_NAME/$_SERVICE_NAME:latest'

substitutions:
  _REGION: 'us-east1'
  _SERVICE_NAME: 'chipllm'
  _SERVICE_ACCOUNT: 'chipllm-runner@chip-496911.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
